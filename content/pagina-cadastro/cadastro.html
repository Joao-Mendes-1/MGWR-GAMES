<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="viewport" content="width=device-width">
	<link rel="stylesheet" type="text/css" href="../style/css/reset.css">
	<link rel="stylesheet" type="text/css" href="../style/css/cadastro.css">
	
	<title>Cadastre-se</title>
</head>
<body class="box">
	<header>
		<div>
			<h1><img src="../style/logo/logo_mgwr.png" class="logo"></h1>
			
		</div>
		
		<nav class="nav">
			<div class="nav-links">
				<a href="../pagina-jogo/pagina-jogo.html">Jogos</a>
				<a href="../pagina-login/login.html">Login</a>
			</div>
		</nav>
	</header>
	
	<main>	
		<div class="form-container">
			<h2>Cadastro</h2>
			<form action="/submit" method="POST" class="signup-form">
			<label for="name">Nome:</label>
			<input type="text" id="name" name="name" required>
		
			<label for="email">E-mail:</label>
			<input type="email" id="email" name="email" required>
		
			<label for="password">Senha:</label>
			<input type="password" id="password" name="password" required>
		
			<button type="submit">Cadastrar</button>
			</form>
	</main>
<script type="text/javascript" src="../script/cadastro.js"></script>
</body>
</html>
